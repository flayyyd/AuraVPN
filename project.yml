name: AuraVPN
options:
  bundleIdPrefix: com.auravpn
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGNING_ALLOWED: NO

targets:
  AuraVPN:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AuraVPN
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.auravpn.app
      INFOPLIST_KEY_CFBundleDisplayName: "AuraVPN"
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
