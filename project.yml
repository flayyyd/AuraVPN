name: AuraVPN
options:
  bundleIdPrefix: com.auravpn
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"

settings:
  IPHONEOS_DEPLOYMENT_TARGET: "16.0"
  SWIFT_VERSION: "5.9"
  DEVELOPMENT_TEAM: ""
  CODE_SIGN_STYLE: Manual
  CODE_SIGN_IDENTITY: ""
  CODE_SIGNING_REQUIRED: NO
  CODE_SIGNING_ALLOWED: NO

targets:
  AuraVPN:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: AuraVPN
    info:
      path: AuraVPN/Info.plist
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.auravpn.app
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: AuraVPN/Info.plist
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: "1.0.0"
