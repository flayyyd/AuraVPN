name: Build iOS .IPA

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App (iOS Release)
        run: |
          xcodebuild \
            -project AuraVPN.xcodeproj \
            -scheme AuraVPN \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Inject FullScreen Retina Keys and Package into .IPA
        run: |
          PLIST="build/Build/Products/Release-iphoneos/AuraVPN.app/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :UILaunchStoryboardName LaunchScreen" "$PLIST" || /usr/libexec/PlistBuddy -c "Add :UILaunchStoryboardName string LaunchScreen" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UILaunchScreen dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" "$PLIST" || true
          plutil -p "$PLIST"
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AuraVPN.app Payload/
          zip -r AuraVPN.ipa Payload
          rm -rf Payload

      - name: Upload .IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraVPN-iOS-App
          path: AuraVPN.ipa
          if-no-files-found: error
